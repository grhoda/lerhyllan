<style>
/* Layout: airy single column, big colour swatches as the visual hook, a ribbon of the user's own glaze colours under the title, pill tabs. */
:root {
  --bg: #efeef3;
  --surface: #ffffff;
  --surface-2: #f6f5f9;
  --ink: #1d1a2b;
  --muted: #615d73;
  --line: #dcd9e6;
  --accent: #2b4de0;
  --accent-ink: #ffffff;
  --accent-soft: #dfe4ff;
  --warn: #9a4a14;
  --shadow: 0 1px 2px rgba(29, 26, 43, .06), 0 8px 24px -12px rgba(29, 26, 43, .18);
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121d; --surface: #1f1c2c; --surface-2: #272336; --ink: #f0eef8; --muted: #a29eb6; --line: #343047;
    --accent: #93a8ff; --accent-ink: #0f1230; --accent-soft: #2a3166; --warn: #e0a56e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121d; --surface: #1f1c2c; --surface-2: #272336; --ink: #f0eef8; --muted: #a29eb6; --line: #343047;
  --accent: #93a8ff; --accent-ink: #0f1230; --accent-soft: #2a3166; --warn: #e0a56e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; padding-inline: 18px; padding-block: 0 120px; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 1040px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { padding-block: 34px 6px; }
.top h1 { display: flex; align-items: center; gap: 14px; }
.top h1 .logo { flex: none; width: 1em; height: 1em; min-width: 44px; min-height: 44px; }
.top h1 { font-size: clamp(40px, 9vw, 64px); font-weight: 800; line-height: 1; }
.counts { font-size: 17px; color: var(--muted); margin-top: 10px; }
.ribbon { display: flex; height: 16px; border-radius: 999px; overflow: hidden; margin-top: 18px; background: var(--surface-2); }
.ribbon i { flex: 1; background: var(--c); display: block; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 0; padding-block: 6px 0; margin-bottom: 18px; overflow-x: auto; border-bottom: 2px solid var(--line); }
.tab { flex: 1 0 auto; background: var(--surface); border: 0; padding: 13px 20px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted); border-radius: 999px; cursor: pointer; box-shadow: var(--shadow); }
.tab { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; box-shadow: none; border-radius: 0; padding: 10px 12px 12px; margin-bottom: -2px; border-bottom: 4px solid transparent; white-space: nowrap; }
.tab .ico { flex: none; }
.tab[aria-selected="true"] { background: none; color: var(--accent); border-bottom-color: var(--accent); }

.toolbar { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.search { width: 100%; background: var(--surface); border: 2px solid transparent; box-shadow: var(--shadow); border-radius: 16px; padding: 14px 16px; font-size: 17px; }
.search:focus-visible { outline: none; border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid transparent; box-shadow: var(--shadow); border-radius: 999px; padding: 10px 16px; font-size: 16px; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip .n { font-size: 14px; opacity: .6; }
.fdot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); flex: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.glist { display: flex; flex-direction: column; gap: 8px; }
.grow { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 8px 10px 8px 8px; border: 2px solid transparent; }
.grow[data-on="1"] { border-color: var(--accent); }
.grow .sw { width: 54px; height: 54px; border-radius: 12px; }
.grow .mid { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.grow .gname { font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.grow .code { font-size: 13px; overflow-wrap: anywhere; }
.grow .pill { font-size: 12px; margin-top: 2px; }
.grow .acts { display: flex; gap: 6px; }
.grow .btn { min-height: 40px; padding: 8px 16px; font-size: 15px; font-weight: 600; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.grow .btn.soft { background: var(--accent-soft); color: var(--accent); }
.grow .btn.ghost { background: transparent; color: var(--accent); }
@media (max-width: 460px) { .grow { grid-template-columns: 54px 1fr; } .grow .acts { grid-column: 1 / -1; } .grow .btn { flex: 1; } }
.gcard { background: var(--surface); border-radius: 14px; padding: 5px 5px 8px; display: flex; flex-direction: column; gap: 5px; min-width: 0; cursor: pointer; position: relative; box-shadow: var(--shadow); border: 3px solid transparent; }
.gcard[aria-pressed="true"] { border-color: var(--accent); }
.gcard .pick { position: absolute; top: 18px; left: 18px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: grid; place-items: center; }
.sw { display: block; background-color: var(--c); border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), inset 0 14px 18px -12px rgba(255,255,255,.45); }
.sw.speck { background-image: radial-gradient(rgba(0,0,0,.4) 1px, transparent 1.6px), radial-gradient(rgba(255,255,255,.45) 1px, transparent 1.6px); background-size: 8px 8px, 13px 13px; background-position: 0 0, 4px 5px; }
.gcard .sw { height: 40px; border-radius: 9px; }
.gcard > div { padding-inline: 3px; }
.gcard .gname { font-size: 13px; line-height: 1.15; }
.gcard .code { font-size: 11px; margin-top: 0; }
.gcard .pill { font-size: 10px; padding: 1px 7px; }
.gcard .link { font-size: 12px; padding: 4px 10px; border: 1.5px solid var(--accent); border-radius: 999px; background: var(--accent-soft); display: inline-flex; align-items: center; gap: 4px; }
.gcard .link::before { content: "i"; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 10px/14px Georgia, serif; text-align: center; }
.gcard .pick { top: 9px; left: 9px; width: 22px; height: 22px; font-size: 12px; }
.gname { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; overflow-wrap: anywhere; }
.code { font-size: 15px; color: var(--muted); margin-top: 2px; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
.pill { font-size: 14px; background: var(--surface-2); border-radius: 999px; padding: 3px 12px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.gcard .meta { flex-wrap: wrap; gap: 6px 8px; }
.gcard .pill { white-space: normal; max-width: 100%; overflow-wrap: anywhere; }
.gcard .code, .gcard .gname { overflow-wrap: anywhere; }
.gsel { position: relative; }
.gsel-btn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.gsel-btn .gsel-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gsel-caret { opacity: .6; }
.gsel-panel { margin-top: 8px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); padding: 10px; box-shadow: var(--shadow); }
.gsel-panel[hidden] { display: none; }
.gsel-search { width: 100%; margin-bottom: 8px; }
.gsel-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.gsel-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 0; background: none; color: var(--ink); cursor: pointer; }
.gsel-opt:hover { background: var(--surface-2); }
.gsel-opt.on { background: var(--accent-soft); color: var(--accent); }
.gsel-opt .gsel-name { flex: 1; min-width: 0; }
.gsel-sub { font-size: 13px; color: var(--muted); }
.gsel .dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; flex: none; }
.gsel .dot.none { box-shadow: inset 0 0 0 2px var(--line); }
.pill.tile { color: var(--warn); }
.link { background: none; border: 0; padding: 8px 4px; color: var(--accent); font-size: 16px; font-weight: 600; cursor: pointer; }

.bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--ink); color: var(--bg); padding: 14px 18px; border-radius: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: center; box-shadow: var(--shadow); max-width: 640px; margin-inline: auto; }
.bar .stack { display: flex; gap: 6px; }
.bar .sw { width: 36px; height: 36px; border-radius: 12px; }
.bar .txt { font-size: 16px; font-weight: 500; }

.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 700; font-size: 16px; cursor: pointer; }

    var isMine = function (c) { return !!c.projectId || !c.by; };
    return { fav: all.filter(function (c) { return c.fav; }), mine: all.filter(isMine), insp: all.filter(function (c) { return !isMine(c); }) };
  }
  function drawSeg() {
    var seg = $("#seg"); seg.hidden = tab !== "glazes"; seg.textContent = "";
    var have = 0; glazes.forEach(function (g) { if (g.form !== "onskelista") have++; });
    var cc = comboCats(), ready = loaded.glazes && loaded.combos;
    [["fav", "Favoriter", cc.fav.length], ["mine", "Mina", cc.mine.length], ["insp", "Inspiration", cc.insp.length], ["glazes", "Sparade glasyrer", have]].forEach(function (x) {
      seg.append(h("button", { type: "button", "aria-pressed": String(sub === x[0]), onclick: function () { sub = x[0]; setTab("glazes"); } }, x[1], h("span", { class: "n" }, ready ? String(x[2]) : "")));
    });
  }
  function setTab(t) {
    if (t === "combos") { t = "glazes"; if (sub === "glazes") sub = "mine"; }
    tab = t;
    ["projects", "glazes", "learn"].forEach(function (k) { $("#tab-" + k).setAttribute("aria-selected", String(k === t)); });
    drawSeg();
    if (t === "glazes") { if (sub !== "glazes") mountCombos(); else mountGlazes(); } else if (t === "learn") mountLearn(); else mountProjects();
  }
  ["projects", "glazes", "learn"].forEach(function (k) { $("#tab-" + k).addEventListener("click", function () { setTab(k); }); });

  function refresh() { updateCounts(); drawSeg(); current.update(); }
  // ---------- Firebase ----------
  var BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7#lh=";
  var imgCache = new Map(), imgCol = null;
  function blobUrl(id) { return /^(https?:|data:)/.test(id) ? id : BLANK + encodeURIComponent(id); }
  function loadImg(id) {
    if (!imgCache.has(id)) imgCache.set(id, imgCol ? imgCol.doc(id).get().then(function (d) { return d.exists ? d.data().data : ""; }).catch(function () { return ""; }) : Promise.resolve(""));
    return imgCache.get(id);
  }
  function fillImgs(root) {
    (root.querySelectorAll ? root.querySelectorAll("img") : []).forEach(function (im) {
      var src = im.getAttribute("src") || "";
      if (src.indexOf(BLANK) !== 0) return;
      var id = decodeURIComponent(src.slice(BLANK.length));
      im.setAttribute("src", BLANK.slice(0, BLANK.indexOf("#")));
      loadImg(id).then(function (u) { if (u) im.src = u; });
    });
  }
  new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) { if (n.tagName === "IMG") fillImgs(n.parentNode || n); else fillImgs(n); } }); }); }).observe(document.body, { childList: true, subtree: true });
  function toDataUrl(blob, max, q) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(blob), im = new Image();
      im.onload = function () {
        var k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", q));
      };
      im.onerror = rej; im.src = url;
    });
  }
  function makeAssets() {
    return {
      upload: function (blob) {
        // Bilderna sparas i Firestore (gratisplanen). Ett dokument får vara högst 1 MB.
        var tries = [[1600, .85], [1280, .8], [1024, .75], [800, .7]], i = 0;
        function next() {
          var t = tries[i++];
          return toDataUrl(blob, t[0], t[1]).then(function (u) { return u.length < 900000 || i >= tries.length ? u : next(); });
        }
        return next().then(function (u) {
          var id = "i-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          imgCache.set(id, Promise.resolve(u));
          return imgCol.doc(id).set({ data: u, createdAt: Date.now() }).then(function () { return { id: id }; });
        });
      }
    };
  }
  function showLogin(msg, mode) {
    mode = mode || "in";
    $("#counts").textContent = msg || "Logga in för att se ditt bibliotek.";
    var v = $("#view"); v.textContent = "";
    var saved = ""; try { saved = localStorage.getItem("lh-email") || ""; } catch (e) {}
    var isNew = mode === "new";
    var email = h("input", { type: "email", class: "search", placeholder: "E-post", value: saved, autocomplete: "email", "aria-label": "E-post", required: true });
    var pw = h("input", { type: "password", class: "search", placeholder: isNew ? "Välj ett lösenord (minst 6 tecken)" : "Lösenord", autocomplete: isNew ? "new-password" : "current-password", "aria-label": "Lösenord", required: true });
    var btn = h("button", { class: "btn", type: "submit" }, isNew ? "Skapa konto" : "Logga in");
    var ERR = {
      "auth/invalid-credential": "Fel e-post eller lösenord.", "auth/wrong-password": "Fel lösenord.", "auth/user-not-found": "Det finns inget konto med den e-posten.",
      "auth/email-already-in-use": "Det finns redan ett konto med den e-posten. Logga in i stället.", "auth/weak-password": "Lösenordet måste vara minst 6 tecken.",
      "auth/invalid-email": "Skriv en giltig e-postadress.", "auth/too-many-requests": "För många försök. Vänta en stund.", "auth/operation-not-allowed": "E-post och lösenord är inte påslaget i Firebase."
    };
    var form = h("form", { style: "display:flex;flex-direction:column;gap:12px;margin-top:16px" }, email, pw, btn);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var addr = email.value.trim(), auth = firebase.auth();
      btn.disabled = true;
      (isNew ? auth.createUserWithEmailAndPassword(addr, pw.value) : auth.signInWithEmailAndPassword(addr, pw.value)).then(function () {
        try { localStorage.setItem("lh-email", addr); } catch (e) {}
      }, function (e) { btn.disabled = false; toast(ERR[e && e.code] || "Det gick inte: " + ((e && e.code) || "okänt fel")); });
    });
    var swap = h("button", { type: "button", class: "link", onclick: function () { try { localStorage.setItem("lh-email", email.value.trim()); } catch (e) {} showLogin(msg, isNew ? "in" : "new"); } }, isNew ? "Har du redan ett konto? Logga in" : "Ny här? Skapa konto");
    var forgot = isNew ? null : h("button", { type: "button", class: "link", onclick: function () {
      var addr = email.value.trim();
      if (!addr) { toast("Skriv din e-post först."); email.focus(); return; }
      firebase.auth().sendPasswordResetEmail(addr).then(function () { toast("Om kontot finns har vi skickat ett mejl för att byta lösenord."); }, function (e) { toast(ERR[e && e.code] || "Det gick inte att skicka mejlet."); });
    } }, "Glömt lösenordet?");
    v.append(h("div", { class: "empty" }, h("b", null, isNew ? "Skapa konto" : "Logga in"),
      isNew ? "Ditt bibliotek är privat. Använd samma e-post och lösenord varje gång så hittar du alltid dina projekt." : "Biblioteket är privat. Logga in med din e-post och ditt lösenord.",
      form, h("div", { style: "display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px" }, swap, forgot)));
  }
  function start() {
    if (!window.firebase || !window.LERHYLLAN_FIREBASE || !window.LERHYLLAN_FIREBASE.apiKey) { $("#counts").textContent = "Firebase är inte inställt. Fyll i firebase-config.js."; return; }
    firebase.initializeApp(window.LERHYLLAN_FIREBASE);
    var fs = firebase.firestore();
    try { fs.settings({ ignoreUndefinedProperties: true }); } catch (e) {}
    try { fs.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}
    var unsubs = [];
    firebase.auth().onAuthStateChanged(function (u) {
      unsubs.forEach(function (f) { f(); }); unsubs = [];
      if (!u) { db = null; assets = null; showLogin(); return; }
      var root = fs.collection("users").doc(u.uid);
      db = { collection: function (n) { return root.collection(n); } };
      imgCol = root.collection("images"); imgCache = new Map();
      assets = makeAssets(); sample = null; canWrite = true;
      loaded = { glazes: false, combos: false, projects: false };
      setTab(tab);
      var fail = function (e) {
        if (e && e.code === "permission-denied") { showLogin("Ditt konto har inte tillgång till biblioteket."); return; }
        toast("Anslutningen till biblioteket bröts. Ladda om sidan.");
      };
      unsubs.push(db.collection("glazes").onSnapshot(function (s) { glazes = new Map(s.docs.map(function (d) { return [d.id, d.data()]; })); loaded.glazes = true; refresh(); }, fail));
      unsubs.push(db.collection("combos").onSnapshot(function (s) { combos = new Map(s.docs.map(function (d) { return [d.id, d.data()]; })); loaded.combos = true; refresh(); }, fail));
      unsubs.push(db.collection("projects").onSnapshot(function (s) { projects = new Map(s.docs.map(function (d) { return [d.id, d.data()]; })); loaded.projects = true; refresh(); }, fail));
    });
    var menu = $(".tools-menu");
    if (menu) menu.append(h("button", { type: "button", role: "menuitem", onclick: function () { menu.hidden = true; firebase.auth().signOut(); } }, "Logga ut"));
  }
  function TOOLS_ITEMS(menu, fileIn, close) {
    menu.append(h("button", { type: "button", role: "menuitem", onclick: function () { close(); exportProjects(); } }, "Exportera projekt"));
    if (canWrite) menu.append(h("button", { type: "button", role: "menuitem", onclick: function () { close(); fileIn.click(); } }, "Importera projekt"));
    fileIn.addEventListener("change", function () { var f = fileIn.files && fileIn.files[0]; fileIn.value = ""; if (f) importProjects(f); });
  }
  (function () {
    var top = $(".top"); if (!top) return;
    var btn = h("button", { type: "button", class: "tools-btn", "aria-label": "Verktyg", "aria-haspopup": "true", "aria-expanded": "false" });
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
    var menu = h("div", { class: "tools-menu", role: "menu", hidden: true });
    var fileIn = h("input", { type: "file", accept: ".json,application/json", hidden: true });
    function close() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    TOOLS_ITEMS(menu, fileIn, close);
    btn.addEventListener("click", function (e) { e.stopPropagation(); var o = menu.hidden; menu.hidden = !o; btn.setAttribute("aria-expanded", String(o)); });
    document.addEventListener("click", function (e) { if (!menu.contains(e.target)) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    top.append(btn, menu, fileIn);
  })();
  setTab("projects");
  start();
})();
</script>
